<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ff0040">
    <title>Sin conexión | Farmacia SJB</title>
    <style>
        body {
            align-items: center;
            background: #f4f6f8;
            color: #263238;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }
        main { max-width: 420px; padding: 2rem; }
        .mark {
            align-items: center;
            background: #ff0040;
            border-radius: 50%;
            color: #fff;
            display: inline-flex;
            font-size: 2rem;
            height: 4rem;
            justify-content: center;
            width: 4rem;
        }
        button {
            background: #ff0040;
            border: 0;
            border-radius: .5rem;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            padding: .75rem 1.25rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">+</div>
        <h1>Estás sin conexión</h1>
        <p>Conéctate a internet para volver a usar el sistema. Por seguridad, las ventas y otros datos no se guardan sin conexión.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
</body>
</html>
